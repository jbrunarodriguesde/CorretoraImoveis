<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Rich Gold Gradients matching the original luxury emblem -->
    <linearGradient id="goldGradientMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E2A9" />
      <stop offset="25%" stop-color="#D8B160" />
      <stop offset="50%" stop-color="#F2D898" />
      <stop offset="75%" stop-color="#BD8D39" />
      <stop offset="100%" stop-color="#E7C67D" />
    </linearGradient>

    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5DB9A" />
      <stop offset="50%" stop-color="#CFA551" />
      <stop offset="100%" stop-color="#8F6721" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#CFA551" />
      <stop offset="60%" stop-color="#F7E5B5" />
      <stop offset="100%" stop-color="#FFF5D6" />
    </linearGradient>

    <!-- Star flare / glow radial gradients -->
    <radialGradient id="starFlareCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEBB8" stop-opacity="0.9" />
      <stop offset="20%" stop-color="#DDB766" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#B28834" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="starFlareSide" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEBB8" stop-opacity="0.75" />
      <stop offset="25%" stop-color="#DDB766" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#B28834" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle backdrop ambient lighting -->
    <radialGradient id="bgAmbient" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#3A2E16" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#1A150A" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Black Background -->
  <rect width="1000" height="1000" fill="#060606" />

  <!-- Ambient Golden Backlight behind the buildings -->
  <circle cx="500" cy="400" r="380" fill="url(#bgAmbient)" />

  <!-- ================= GLOW FLARES AT PEAKS ================= -->
  <!-- Center Tower Glow -->
  <circle cx="500" cy="216" r="140" fill="url(#starFlareCenter)" />
  <!-- Center Star 4-point sparkle -->
  <path d="M500 130 L503 213 L586 216 L503 219 L500 302 L497 219 L414 216 L497 213 Z" fill="#FFF2CE" opacity="0.45" />

  <!-- Tower 2 Glow (Left) -->
  <circle cx="362" cy="338" r="95" fill="url(#starFlareSide)" />
  <path d="M362 285 L364 336 L415 338 L364 340 L362 391 L360 340 L309 338 L360 336 Z" fill="#FFF2CE" opacity="0.3" />

  <!-- Tower 4 Glow (Right) -->
  <circle cx="638" cy="338" r="95" fill="url(#starFlareSide)" />
  <path d="M638 285 L640 336 L691 338 L640 340 L638 391 L636 340 L585 338 L636 336 Z" fill="#FFF2CE" opacity="0.3" />


  <!-- ================= ARCHITECTURAL TOWERS ================= -->
  <!-- Tower 1 (Outer Left) -->
  <g stroke="url(#goldStroke)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer silhouette -->
    <path d="M168 506 L212 470 L256 506 L256 650 M168 506 L168 695" />
    <!-- Center spine -->
    <path d="M212 470 L212 660" stroke-width="5" opacity="0.9" />
    <!-- Inner facet bevel lines -->
    <path d="M192 486 L192 680" stroke-width="4" stroke="url(#goldLight)" opacity="0.65" />
    <path d="M234 486 L234 650" stroke-width="4" stroke="url(#goldLight)" opacity="0.65" />
  </g>

  <!-- Tower 5 (Outer Right) -->
  <g stroke="url(#goldStroke)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer silhouette -->
    <path d="M744 506 L788 470 L832 506 L832 695 M744 506 L744 650" />
    <!-- Center spine -->
    <path d="M788 470 L788 660" stroke-width="5" opacity="0.9" />
    <!-- Inner facet bevel lines -->
    <path d="M766 486 L766 650" stroke-width="4" stroke="url(#goldLight)" opacity="0.65" />
    <path d="M808 486 L808 680" stroke-width="4" stroke="url(#goldLight)" opacity="0.65" />
  </g>

  <!-- Tower 2 (Mid Left) -->
  <g stroke="url(#goldStroke)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer silhouette -->
    <path d="M308 386 L362 338 L416 386 L416 575 M308 386 L308 620" />
    <!-- Center spine -->
    <path d="M362 338 L362 590" stroke-width="5.5" opacity="0.95" />
    <!-- Inner facet bevel lines -->
    <path d="M336 362 L336 610" stroke-width="4.5" stroke="url(#goldLight)" opacity="0.75" />
    <path d="M388 362 L388 580" stroke-width="4.5" stroke="url(#goldLight)" opacity="0.75" />
  </g>

  <!-- Tower 4 (Mid Right) -->
  <g stroke="url(#goldStroke)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer silhouette -->
    <path d="M584 386 L638 338 L692 386 L692 620 M584 386 L584 575" />
    <!-- Center spine -->
    <path d="M638 338 L638 590" stroke-width="5.5" opacity="0.95" />
    <!-- Inner facet bevel lines -->
    <path d="M612 362 L612 580" stroke-width="4.5" stroke="url(#goldLight)" opacity="0.75" />
    <path d="M664 362 L664 610" stroke-width="4.5" stroke="url(#goldLight)" opacity="0.75" />
  </g>

  <!-- Tower 3 (Center Tallest Tower) -->
  <g stroke="url(#goldStroke)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer silhouette -->
    <path d="M444 274 L500 216 L556 274 L556 550 M444 274 L444 550" />
    <!-- Center vertical spine -->
    <path d="M500 216 L500 545" stroke-width="6" stroke="url(#goldLight)" opacity="0.98" />
    <!-- Inner facet bevel lines -->
    <path d="M472 245 L472 548" stroke-width="5" stroke="url(#goldLight)" opacity="0.8" />
    <path d="M528 245 L528 548" stroke-width="5" stroke="url(#goldLight)" opacity="0.8" />
  </g>


  <!-- ================= GABLE ROOF SILHOUETTE ================= -->
  <g stroke="url(#goldGradientMain)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main primary roofline with subtle outward flare at eaves -->
    <path
      d="M236 714 C 280 714, 320 684, 370 644 L 500 545 L 630 644 C 680 684, 720 714, 764 714"
      stroke-width="11"
    />
    <!-- Lower parallel accent curve -->
    <path
      d="M260 717 C 295 717, 335 692, 380 655 L 500 564 L 620 655 C 665 692, 705 717, 740 717"
      stroke-width="4"
      opacity="0.6"
    />
  </g>

  <!-- ================= FOUR-PANE RESIDENCE WINDOW ================= -->
  <g transform="translate(473, 660)">
    <!-- 4 golden window panes -->
    <rect x="0" y="0" width="24" height="24" rx="2" fill="url(#goldLight)" />
    <rect x="30" y="0" width="24" height="24" rx="2" fill="url(#goldLight)" />
    <rect x="0" y="30" width="24" height="24" rx="2" fill="url(#goldLight)" />
    <rect x="30" y="30" width="24" height="24" rx="2" fill="url(#goldLight)" />
  </g>


  <!-- ================= TYPOGRAPHY ================= -->
  <!-- JACQUELINE ALMEIDA -->
  <text
    x="500"
    y="784"
    text-anchor="middle"
    fill="url(#goldGradientMain)"
    font-family="'Playfair Display', 'Cinzel', 'Trajan Pro', 'Didot', 'Baskerville', 'Georgia', serif"
    font-size="52"
    font-weight="600"
    letter-spacing="9"
  >
    JACQUELINE ALMEIDA
  </text>

  <!-- CORRETORA DE IMÓVEIS WITH SIDE ACCENT LINES -->
  <!-- Left Rule -->
  <line x1="75" y1="814" x2="205" y2="814" stroke="url(#goldStroke)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Subtitle Text -->
  <text
    x="500"
    y="824"
    text-anchor="middle"
    fill="url(#goldGradientMain)"
    font-family="'Plus Jakarta Sans', 'Montserrat', 'Inter', -apple-system, sans-serif"
    font-size="28"
    font-weight="500"
    letter-spacing="10"
  >
    CORRETORA DE IMÓVEIS
  </text>

  <!-- Right Rule -->
  <line x1="795" y1="814" x2="925" y2="814" stroke="url(#goldStroke)" stroke-width="2.5" stroke-linecap="round" />
</svg>
